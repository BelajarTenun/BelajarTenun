# Nginx untuk BelajarTenun di VPS yang sudah punya aplikasi lain.
# Salin ke /etc/nginx/sites-available/belajartenun, aktifkan, lalu ambil sertifikat:
#   sudo ln -s /etc/nginx/sites-available/belajartenun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d belajartenun.com -d www.belajartenun.com -d livekit.belajartenun.com
# Port 8080/7880 harus sama dengan APP_PORT/LIVEKIT_PORT di .env (default 8080 dan 7880).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name belajartenun.com www.belajartenun.com;
    client_max_body_size 300m;          # unggah rekaman & video sumber

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name livekit.belajartenun.com;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;       # sesi suara realtime
    }
}
