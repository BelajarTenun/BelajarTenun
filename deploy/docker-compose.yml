# BelajarTenun – app (web + API), LiveKit, agen Gemini Live.
# Jalankan dari folder deploy/:  docker compose --env-file ../.env up -d --build
#
# Dua cara menerima HTTPS:
#  - VPS sudah punya web server (Nginx/Caddy/Traefik) untuk aplikasi lain: JANGAN aktifkan profil "caddy".
#    App dan LiveKit hanya mendengar di 127.0.0.1:${APP_PORT:-8080} dan 127.0.0.1:${LIVEKIT_PORT:-7880};
#    web server yang ada meneruskan domain BelajarTenun ke sana (contoh: deploy/nginx-belajartenun.conf).
#  - VPS kosong: set COMPOSE_PROFILES=caddy di .env, Caddy mengambil port 80/443 dan HTTPS otomatis.
services:
  app:
    # CD (GitHub Actions) memakai image dari ghcr.io; tanpa APP_IMAGE, dibangun dari sumber.
    image: ${APP_IMAGE:-belajartenun-app:local}
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://livekit.${DOMAIN}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"   # hanya dari VPS ini (web server di depannya)

  agent:
    image: ${AGENT_IMAGE:-belajartenun-agent:local}
    build: ../agent
    restart: unless-stopped
    env_file: ../.env
    environment:
      BT_SERVER: http://app:8080
      LIVEKIT_URL: ws://livekit:7880
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
    volumes:
      - ./secrets:/secrets:ro
    depends_on: [app, livekit]

  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"  # sinyal WebSocket, diteruskan web server ke livekit.DOMAIN
      - "7881:7881/tcp"              # WebRTC lewat TCP (cadangan)
      - "50000-50100:50000-50100/udp" # media WebRTC

  caddy:
    profiles: ["caddy"]          # hanya untuk VPS tanpa web server lain
    image: caddy:2.8.4
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app, livekit]

volumes:
  data:
  caddy:
