# Konfigurasi LiveKit lokal untuk BelajarTenun.
# Ganti kunci di bawah (dan samakan dengan LIVEKIT_API_KEY / LIVEKIT_API_SECRET di .env).
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # true: deteksi IP publik via STUN (dipakai bila HP di luar jaringan lokal).
  # false: cukup untuk HP & laptop di Wi-Fi/hotspot yang sama.
  use_external_ip: false
keys:
  belajartenun: ganti-dengan-rahasia-panjang-minimal-32-karakter
logging:
  level: info
room:
  empty_timeout: 300
