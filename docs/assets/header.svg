<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">BelajarTenun</title>
  <desc id="d">Tutor AI di kacamata untuk belajar menenun tradisional</desc>
  <defs>
    <!-- Motif anyaman: lungsi (vertikal) dan pakan (horizontal) bergantian -->
    <pattern id="weave" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#7f2716"/>
      <rect x="0" y="0" width="24" height="12" fill="#a3361f"/>
      <rect x="24" y="24" width="24" height="12" fill="#a3361f"/>
      <rect x="24" y="0" width="12" height="24" fill="#c4572f"/>
      <rect x="0" y="24" width="12" height="24" fill="#c4572f"/>
      <rect x="12" y="12" width="12" height="12" fill="#d9a441"/>
      <rect x="36" y="36" width="12" height="12" fill="#d9a441"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1c120d" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#1c120d" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#1c120d" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#weave)"/>
  <rect width="1280" height="320" fill="url(#fade)"/>
  <!-- Garis songket emas -->
  <rect x="72" y="76" width="64" height="6" fill="#d9a441"/>
  <text x="72" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#f7efe3" letter-spacing="1">BelajarTenun</text>
  <text x="74" y="214" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e9d6bd">Tutor AI di kacamata untuk belajar menenun tradisional</text>
  <text x="74" y="256" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#c9b49a" letter-spacing="3">KAMERA  ·  SUARA REAL-TIME  ·  PENGETAHUAN TERVALIDASI PENENUN</text>
</svg>
