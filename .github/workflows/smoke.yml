# Tes asap harian produksi: menjalankan "Cek koneksi" (AI teks, gambar, embeddings, LiveKit, model Live dari agen).
# Gagal = ada layanan/model yang mati (mis. model Live pensiun) sebelum murid terkena.
# Butuh secret SMOKE_AGENT_TOKEN (= AGENT_TOKEN di .env VPS) dan variabel PUBLIC_URL (mis. https://belajartenun.com).
name: Tes asap harian
on:
  schedule: [{ cron: '17 22 * * *' }]   # 05.17 WIB
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Cek koneksi produksi
        env:
          TOKEN: ${{ secrets.SMOKE_AGENT_TOKEN }}
          URL: ${{ vars.PUBLIC_URL || 'https://belajartenun.com' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SMOKE_AGENT_TOKEN belum diisi; lewati"; exit 0; fi
          curl -sf -m 180 -H "x-agent-token: $TOKEN" "$URL/api/admin/diagnostics" > diag.json
          node -e '
            const d = require("./diag.json");
            for (const c of d.checks) console.log(`${c.status.padEnd(5)} ${c.name}: ${c.detail}`);
            const bad = d.checks.filter((c) => c.status === "gagal");
            if (bad.length) { console.error(`\n${bad.length} pemeriksaan gagal`); process.exit(1); }
          '
