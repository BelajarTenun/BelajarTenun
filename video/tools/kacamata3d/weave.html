const NAVY = '#141c3a', CREAM = '#f5efe2', GOLD = '#d4b866';

const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ── Figur: sendi sederhana, lengan & kaki dengan IK 2-tulang ─────────────────
const DOWN = V(0, -1, 0);

  const body = new THREE.Group(); root.add(body);
  const parts = [];
  const mk = (geo, mat, parent, pos) => { const m = new THREE.Mesh(geo, mat); if (pos) m.position.copy(pos); parent.add(m); parts.push(m); return m; };
  const torso = new THREE.Group(); torso.position.y = 0.92; body.add(torso);
  mk(new THREE.CapsuleGeometry(0.15, 0.32, 8, 24), top, torso, V(0, 0.2, 0)).scale.set(1.05, 1, 0.72);
  mk(new THREE.CapsuleGeometry(0.135, 0.1, 8, 24), bottom, torso, V(0, -0.02, 0)).scale.set(1.12, 1, 0.8);
  if (scarf) { const sc = mk(new THREE.TorusGeometry(0.12, 0.035, 12, 32), scarf, torso, V(0, 0.47, 0.0)); sc.rotation.x = Math.PI / 2; sc.scale.set(1.1, 0.85, 1); }
  const neck = new THREE.Group(); neck.position.y = 0.5; torso.add(neck);
  mk(new THREE.CylinderGeometry(0.045, 0.05, 0.08, 16), M.skin, neck, V(0, 0.03, 0));
  const head = new THREE.Group(); head.position.y = 0.17; neck.add(head);
  mk(new THREE.SphereGeometry(0.105, 32, 24), M.skin, head).scale.set(0.92, 1.08, 1);
  if (hair === 'bun') { mk(new THREE.SphereGeometry(0.108, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.55), M.hair, head, V(0, 0.012, -0.008)).scale.set(0.95, 1.08, 1.03); mk(new THREE.SphereGeometry(0.055, 24, 16), M.hair, head, V(0, 0.06, -0.11)); }
  else if (hair === 'short') { mk(new THREE.SphereGeometry(0.11, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.5), M.hair, head, V(0, 0.018, -0.006)).scale.set(0.96, 1.05, 1.06); }
  // lengan
  const arm = (sx) => {

    mk(new THREE.CapsuleGeometry(0.045, 0.2, 6, 16), top, up, V(0, -0.13, 0));
    const fo = new THREE.Group(); fo.position.y = -0.27; up.add(fo);
    mk(new THREE.CapsuleGeometry(0.038, 0.2, 6, 16), M.skin, fo, V(0, -0.12, 0));
    mk(new THREE.SphereGeometry(0.045, 16, 12), M.skin, fo, V(0, -0.26, 0)).scale.set(0.8, 1.1, 0.6);

  };
  const leg = (sx) => {
    const th = new THREE.Group(); th.position.set(sx * 0.085, 0.92, 0); body.add(th);
    mk(new THREE.CapsuleGeometry(0.068, 0.32, 6, 16), bottom, th, V(0, -0.21, 0));
    const sh = new THREE.Group(); sh.position.y = -0.43; th.add(sh);

}
// IK: target dalam koordinat dunia, pole = arah siku (dunia)
const _q = new THREE.Quaternion(), _qi = new THREE.Quaternion();
function ik(limb, parent, targetW, poleW, a = 'up', b = 'fo') {
  const p = limb[a].parent; p.updateMatrixWorld(true);
  const inv = p.matrixWorld.clone().invert();
  const S = limb[a].position.clone();
  const sc = new THREE.Vector3(); p.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), sc);
  const Tl = targetW.clone().applyMatrix4(inv);
  const pole = poleW.clone().transformDirection(inv).normalize();
  const d = Tl.clone().sub(S); const L1 = limb.L1, L2 = limb.L2;
  const D = Math.min(d.length(), L1 + L2 - 1e-3); const dh = d.clone().normalize();
  const al = Math.acos(THREE.MathUtils.clamp((L1 * L1 + D * D - L2 * L2) / (2 * L1 * D), -1, 1));
  const n = pole.clone().sub(dh.clone().multiplyScalar(pole.dot(dh))).normalize();
  const E = S.clone().add(dh.clone().multiplyScalar(L1 * Math.cos(al))).add(n.multiplyScalar(L1 * Math.sin(al)));
  const T2 = S.clone().add(dh.clone().multiplyScalar(D));
  const u = E.clone().sub(S).normalize(), v = T2.clone().sub(E).normalize();
  limb[a].quaternion.setFromUnitVectors(DOWN, u);
  _q.setFromUnitVectors(DOWN, v); _qi.copy(limb[a].quaternion).invert();

}
const setOpacity = (P, o) => P.parts.forEach((m) => { m.material = m.material.clone(); m.material.opacity = o; m.castShadow = o > 0.5; });

// Duduk bersila di tikar (alat tenun gedogan): pinggul rendah, kaki ke depan
function seat(P) {
  P.body.position.y = -0.8;
  for (const [l, sx] of [[P.ll, 1], [P.rl, -1]]) { l.th.rotation.x = -Math.PI / 2 + 0.12; l.th.rotation.z = sx * 0.28; l.sh.rotation.x = 0.0; l.sh.rotation.z = -sx * 0.1; }
}
// Alat tenun gedogan: pinggang → tiang. Kain bermotif di dekat badan.
function motifTex(rows = 48, cols = 64, seed = 3) {
  const c = document.createElement('canvas'); c.width = cols * 8; c.height = rows * 8; const x = c.getContext('2d');
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const dx = Math.abs(((k % 16) - 7.5)), dy = Math.abs(((r % 16) - 7.5));
    const d = dx + dy; const band = Math.floor(r / 16) % 2;
    x.fillStyle = d < 3 ? GOLD : d < 5 ? CREAM : d < 6.2 ? GOLD : band ? NAVY : '#26305a';
    x.fillRect(k * 8, r * 8, 8, 8);
    x.fillStyle = 'rgba(0,0,0,0.12)'; x.fillRect(k * 8, r * 8 + 6, 8, 2);
  }

}
const MOTIF = motifTex();
function loom(len = 1.15, woven = 0.32) {

  const wood = clay('#c9a96a', 0.5);
  const bar = (z) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.56, 16), wood); m.rotation.z = Math.PI / 2; m.position.set(0, 0, z); g.add(m); return m; };
  bar(0); bar(len);
  const warpM = new THREE.MeshStandardMaterial({ color: '#f3ead6', roughness: 0.8, transparent: true });
  for (let i = 0; i < 34; i++) { const x = -0.25 + i * (0.5 / 33); const m = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0022, len - woven, 4), warpM); m.rotation.x = Math.PI / 2; m.position.set(x, (i % 2 ? 0.004 : -0.004), woven + (len - woven) / 2); g.add(m); }

  MOTIF.wrapS = MOTIF.wrapT = THREE.RepeatWrapping; cloth.position.z = woven / 2; g.add(cloth);
  const beater = new THREE.Mesh(new RoundedBoxGeometry(0.6, 0.012, 0.05, 2, 0.005), wood); beater.position.set(0, 0.02, woven + 0.04); g.add(beater);
  const shuttle = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.34, 10), M.gold); shuttle.rotation.z = Math.PI / 2; shuttle.position.set(0, 0.03, woven + 0.1); g.add(shuttle);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.9, 16), wood); post.position.set(0, -0.15, len + 0.03); g.add(post);
  shadowy(g);

}
// Satu penenun lengkap + animasi menenun pada waktu t (siklus 1.3 dtk)
function weaver(opts = {}) {
  const P = person({ hair: 'bun', top: M.navy, bottom: M.navy, scarf: M.gold, ...opts }); seat(P);
  const L = loom(); L.g.position.set(0, 0.17, 0.2); L.g.rotation.x = -0.18; P.root.add(L.g);
  const strap = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.012, 8, 32), clay('#c9a96a')); strap.rotation.x = Math.PI / 2; strap.scale.set(1.05, 0.75, 1); strap.position.y = 0.14; P.root.add(strap);

    const pass = ease(c / 0.55), beat = Math.sin(Math.PI * THREE.MathUtils.clamp((c - 0.6) / 0.3, 0, 1));

    L.beater.position.z = L.woven + 0.06 - beat * 0.05;
    P.root.updateMatrixWorld(true);
    const wp = (x, z) => L.g.localToWorld(V(x, 0.05, z));
    const hR = c < 0.6 ? wp(sx, L.woven + 0.1) : wp(-0.22, L.beater.position.z);
    const hL = c < 0.6 ? wp(dir > 0 ? 0.24 : -0.24, L.woven + 0.12).lerp(wp(sx, L.woven + 0.1), 0.25) : wp(0.22, L.beater.position.z);
    const out = (sx_) => P.root.localToWorld(V(sx_ * 0.5, -0.3, -0.1)).sub(P.root.localToWorld(V(0, 0, 0)));
    ik(P.ra, null, hR, out(-1)); ik(P.la, null, hL, out(1));

}

// ── Lampu & lantai ───────────────────────────────────────────────────────────
const key = new THREE.DirectionalLight('#fff4e2', 2.2); key.position.set(-3, 6, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 20; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 }); scene.add(key);
const rim = new THREE.DirectionalLight('#ffe0a0', 1.6); rim.position.set(4, 3, -5); scene.add(rim);
scene.add(new THREE.HemisphereLight('#ffffff', '#e6dccb', 0.6));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), alpha ? new THREE.ShadowMaterial({ color: NAVY, opacity: 0.22 }) : new THREE.MeshStandardMaterial({ color: CREAM, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 200);
const anchors = {};
const anchor = (name, obj, local = V(0, 0, 0)) => { anchors[name] = () => obj.localToWorld(local.clone()); };

// ── SHOT: serah-terima kain (latar transparan, di atas footage Andrew) ───────
if (shot === 'hand') {
  const E = weaver(); E.root.position.set(0.05, 0, 0); E.root.rotation.y = -0.55; scene.add(E.root);
  const Y = person({ hair: 'short', top: M.white, bottom: M.navy, s: 0.97 }); Y.root.position.set(1.05, 0, 0.55); Y.root.rotation.y = -Math.PI / 2 - 0.35; scene.add(Y.root);
  const roll = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.05, 0.22, 3, 0.02), new THREE.MeshPhysicalMaterial({ map: MOTIF, roughness: 0.7, sheen: 0.5 })); shadowy(roll); scene.add(roll);
  // 0–0.7 menenun; 0.7–1.4 angkat kain & ulurkan; 1.4–2.0 diterima, didekap
  E.weave(Math.min(T, 0.7) + 0.2);
  scene.updateMatrixWorld(true);
  const lap = E.root.localToWorld(V(0, 0.22, 0.42));
  const meet = V(0.62, 0.92, 0.42);
  const chest = Y.root.localToWorld(V(0, 1.05, 0.22));
  const a = seg(T, 0.7, 1.35), b = seg(T, 1.45, 1.95);

}

// ── SHOT: lima penenun, satu per satu memudar jadi benang yang jatuh ─────────
if (shot === 'fade') {

  const xs = [-2.0, -1.0, 0, 1.0, 2.0];
  xs.forEach((x, i) => {
    const P = weaver({ s: 1 }); P.root.position.set(x, 0, -Math.abs(x) * 0.25); P.root.rotation.y = -0.85; scene.add(P.root); P.weave(T + i * 0.37);

        m.position.set(x + (r() - 0.5) * 0.6, Math.max(0.01, 0.5 + r() * 0.6 - 4.9 * tt * tt), (r() - 0.2) * 0.7);

  });

}

// ── SHOT: anak muda berjalan masuk → kamera naik: kota vs desa ───────────────
if (shot === 'walkmap') {

  // kamera: dekat (jalan) → naik & mundur (peta)
  const up = eo((T - 1.35) / 1.4);
  camera.position.set(lerp(0.9, -3.0, up), lerp(1.2, 9.5, up), lerp(4.2, 10.5, up)); camera.lookAt(lerp(0.8, -3.2, up), lerp(0.85, 0.2, up), lerp(0, -0.6, up));
  anchor('phone', phone); anchor('elder', E.head); anchor('youth', Y.head);
}

// ── SHOT: kain bermotif terurai benang demi benang ───────────────────────────
if (shot === 'unravel') {
  const rows = 40, wv = 1.6, hv = 1.0;
  const rowH = hv / rows;
  for (let r = 0; r < rows; r++) {
    const t0 = 0.15 + (rows - 1 - r) * 0.045; const tt = Math.max(0, T - t0);
    const tex = MOTIF.clone(); tex.needsUpdate = true; tex.repeat.set(1, 1 / rows); tex.offset.set(0, r / rows);
    const m = new THREE.Mesh(new RoundedBoxGeometry(wv, rowH * 0.92, 0.012, 2, 0.004), new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.7, sheen: 0.6, transparent: true }));
    const fall = tt * tt * 3.2, k = Math.min(1, tt * 1.6);
    m.position.set(Math.sin(r * 1.7) * fall * 0.25, 0.25 + r * rowH - fall, k * Math.sin(r * 0.9) * 0.3);
    m.rotation.set(k * (0.3 + Math.sin(r) * 0.2), 0, k * Math.sin(r * 2.3) * 0.25);
    m.material.opacity = 1 - THREE.MathUtils.clamp((tt - 0.5) / 0.5, 0, 1);
    m.castShadow = true; if (m.material.opacity > 0) scene.add(m);
  }
  // lungsi tegak tetap sebentar, lalu ikut jatuh
  for (let i = 0; i < 30; i++) {
    const tt = Math.max(0, T - 2.0 - (i % 7) * 0.03);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, hv + 0.15, 5), M.cream);
    m.position.set(-wv / 2 + 0.03 + i * (wv - 0.06) / 29, 0.25 + hv / 2 - tt * tt * 6, -0.01); m.rotation.z = tt * Math.sin(i) * 1.2; m.material = m.material.clone(); m.material.opacity = 1 - Math.min(1, tt * 2); scene.add(m);
  }
  camera.position.set(0, 0.85, lerp(2.9, 3.2, T / 2.6)); camera.lookAt(0, 0.7, 0);
  floor.position.y = -0.4;
}

renderer.render(scene, camera);
const out = {};
for (const [k, f] of Object.entries(anchors)) { const p = f().project(camera); out[k] = [Math.round((p.x + 1) / 2 * W), Math.round((1 - p.y) / 2 * H)]; }
window.__anchors = out;
document.title = 'done';
</script></body></html>
