; BelajarTenun Glasses – firmware XIAO ESP32S3 Sense
; Kompilasi & unggah:  pio run -t upload    |    monitor serial: pio device monitor
[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.3
