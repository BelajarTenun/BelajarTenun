<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator Kacamata · BelajarTenun</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0b0b0b; color: #ddd; }
    .sim { max-width: 900px; margin: 0 auto; padding: 16px; }
    .sim a { color: #ffb38a; }
    /* Tampilan lensa: latar = dunia nyata (kamera), teks hijau monokrom seperti HUD kacamata */
    .lens { position: relative; aspect-ratio: 16 / 9; border-radius: 48% 48% 40% 40% / 30% 30% 45% 45%; overflow: hidden; border: 10px solid #222; }
    .lens video { width: 100%; height: 100%; object-fit: cover; filter: brightness(.8); }
    .hud-text { position: absolute; left: 12%; right: 12%; top: 18%; color: #6dff9e; font: 600 clamp(14px, 3vw, 22px)/1.3 ui-monospace, monospace;
      text-shadow: 0 0 6px #0f0a; white-space: pre-wrap; }
    .sim .row { margin-top: 12px; }
    .sim button { background: #222; color: #eee; border-color: #444; }
    .sim button.primary { background: #a3361f; }
    .log { font: 12px/1.4 ui-monospace, monospace; background: #111; padding: 8px; border-radius: 8px; max-height: 180px; overflow: auto; margin-top: 12px; white-space: pre-wrap; }
    .sim input { flex: 1; min-width: 0; font: inherit; padding: .6rem .9rem; border-radius: 999px; border: 1px solid #444; background: #161616; color: #eee; }
  </style>
</head>
<body>
<div class="sim">
  <p><a href="./">← BelajarTenun</a> · Simulator kacamata: memakai <b>Glasses API</b> yang sama dengan smart glasses sungguhan (lihat docs/KACAMATA.md).</p>
  <div class="lens"><video id="cam" autoplay playsinline muted></video><div class="hud-text" id="hud">Tekan "Pakai kacamata"</div></div>
  <div class="row">
    <button id="start" class="primary">👓 Pakai kacamata</button>
    <button data-btn="next">Tap: lanjut</button>
    <button data-btn="repeat">Tap: ulangi</button>
    <button id="mic">🎙️ Bicara</button>
  </div>
  <form id="say" class="row"><input id="text" placeholder='Ucapan (mis. "kenapa tepi menyempit?" / "sudah")'><button>Kirim</button></form>
  <div class="log" id="log"></div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
let sessionId, timer;
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json());
const log = (t) => { $('log').textContent = `${new Date().toLocaleTimeString()}  ${t}\n` + $('log').textContent; };

// Inilah seluruh tugas klien kacamata: tampilkan "display", ucapkan "speak".
function render(r) {
  if (r.error) return log(`error: ${r.error}`);
  if (r.display) $('hud').textContent = r.display;
  if (r.speak) {
    log(`🔊 ${r.speak}`);
    if (r.audio) new Audio(`data:audio/mp3;base64,${r.audio}`).play();
    else { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.speak); u.lang = 'id-ID'; speechSynthesis.speak(u); }
  }
  if (r.finished) clearInterval(timer);
}

function frame() {
  const v = $('cam'); if (!v.videoWidth) return;
  const c = document.createElement('canvas'); c.width = 640; c.height = Math.round(v.videoHeight / v.videoWidth * 640);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  post('/api/glasses/frame', { sessionId, image: c.toDataURL('image/jpeg', 0.7) }).then((r) => { if (!r.skipped) render(r); });
}

$('start').onclick = async () => {
  try { $('cam').srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch { log('kamera tidak tersedia'); }
  const cfg = await fetch('/api/config').then((r) => r.json());
  const r = await post('/api/glasses/start', { audio: cfg.tts });
  sessionId = r.sessionId; render(r);
  clearInterval(timer); timer = setInterval(frame, 2000); // kacamata mengirim frame tiap 2 dtk; server membatasi pemanggilan AI
};
document.querySelectorAll('[data-btn]').forEach((b) => b.onclick = async () => render(await post('/api/glasses/button', { sessionId, action: b.dataset.btn })));
$('say').onsubmit = async (e) => { e.preventDefault(); const text = $('text').value; $('text').value = ''; log(`🗣️ ${text}`); render(await post('/api/glasses/say', { sessionId, text })); };
$('mic').onclick = () => {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return log('pengenalan suara tidak didukung browser ini');
  const rec = new R(); rec.lang = 'id-ID';
  rec.onresult = async (e) => { const text = e.results[0][0].transcript; log(`🗣️ ${text}`); render(await post('/api/glasses/say', { sessionId, text })); };
  rec.start();
};
</script>
</body>
</html>
