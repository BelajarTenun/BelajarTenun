<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progres · BelajarTenun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <header class="brand">
    <div class="account" id="account"></div>
    <a class="wordmark" href="./">BelajarTenun</a>
    <h1>Progres Belajar</h1>
    <p id="scope"></p>
  </header>
  <label class="picker">Modul <select id="module"></select></label>
  <section class="stats" id="stats"></section>
  <section class="card">
    <h2>Per tahap</h2>
    <p class="hint">Tahap dengan banyak pertanyaan, petunjuk, atau kesalahan adalah yang paling membingungkan pemula. Prioritaskan untuk diperbaiki instruksi atau video demonya.</p>
    <div id="steps"></div>
  </section>
  <section class="card">
    <h2>Kuesioner akhir sesi</h2>
    <div id="survey"></div>
  </section>
  <section class="card">
    <h2>Riwayat sesi</h2>
    <div id="sessions"></div>
  </section>
<script type="module">
import { api, $, esc, accountBadge } from './js/api.js';
const cfg = await api('/api/config');
accountBadge($('account'), cfg.user);
const pct = (x) => `${Math.round(x * 100)}%`;
const { modules } = await api('/api/modules');
$('module').innerHTML = modules.map((m) => `<option value="${m.id}">${esc(m.title)}</option>`).join('');
$('module').onchange = render;
async function render() {
  const id = $('module').value;
  const [p, mod] = await Promise.all([api(`/api/progress?moduleId=${id}`), api(`/api/module?id=${id}`)]);
  $('scope').textContent = p.scope === 'saya' ? (cfg.user ? 'Progres latihanmu.' : 'Masuk untuk menyimpan progresmu sendiri.') : 'Ringkasan semua sesi (learning validation).';
  const title = (sid) => mod.steps.find((s) => s.id === sid)?.title ?? sid;
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  $('stats').innerHTML = stat(p.totalSessions, 'sesi') + stat(p.completed, 'selesai') + stat(pct(p.completionRate), 'tingkat selesai');
  const order = mod.steps.map((s) => s.id);
  const steps = p.steps.filter((s) => order.includes(s.step)).sort((a, b) => order.indexOf(a.step) - order.indexOf(b.step));
  $('steps').innerHTML = steps.length ? `<table><tr><th>Tahap</th><th>Selesai</th><th>Dikenali kamera</th><th>Pertanyaan</th><th>Petunjuk tutor</th><th>Kesalahan</th></tr>${steps.map((s) =>
    `<tr><td>${esc(title(s.step))}</td><td>${s.done}</td><td>${s.done ? pct(s.vision / s.done) : '-'}</td><td>${s.questions}</td><td>${s.hints ?? 0}</td><td>${s.mistakes}</td></tr>`).join('')}</table>` : '<p>Belum ada data.</p>';
  const sv = p.survey;
  $('survey').innerHTML = sv?.n ? `<div class="stats">${stat(sv.mudah ?? '-', 'mudah diikuti (1–5)')}${stat(sv.paham ?? '-', 'paham alasan (1–5)')}${stat(sv.percaya_diri ?? '-', 'percaya diri (1–5)')}</div><p class="hint">${sv.n} jawaban.</p><ul>${sv.comments.slice(0, 10).map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : '<p>Belum ada jawaban.</p>';
  $('sessions').innerHTML = p.sessions.length ? `<table><tr><th>Mulai</th><th>Sumber</th><th>Tahap selesai</th><th>Durasi</th><th>Status</th></tr>${p.sessions.slice(0, 50).map((s) =>
    `<tr><td>${String(s.start).slice(0, 16).replace('T', ' ')}</td><td>${esc(s.source || '-')}</td><td>${s.stepsDone}</td><td>${s.minutes} mnt</td><td>${s.done ? 'Selesai' : '—'}</td></tr>`).join('')}</table>` : '<p>Belum ada sesi.</p>';
}
render();
</script>
</body>
</html>
