<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BelajarTenun">
  <!-- Tanda BelajarTenun: anyaman polos, teknik pertama setiap penenun.
       Tiga lungsi (krem, tegak) dan dua pakan (emas, mendatar) saling bergantian atas-bawah. -->
  <rect width="64" height="64" rx="14" fill="#141c3a"/>
  <g fill="none" stroke-linecap="round">
    <path d="M20 12v40M32 12v40M44 12v40" stroke="#f5efe2" stroke-width="5"/>
    <path d="M10 25h44M10 39h44" stroke="#141c3a" stroke-width="8"/>
    <path d="M10 25h44M10 39h44" stroke="#d4b866" stroke-width="5"/>
  </g>
  <!-- lungsi yang berada di atas pakan -->
  <rect x="28.2" y="20.6" width="7.6" height="8.8" fill="#141c3a"/>
  <rect x="29.5" y="20" width="5" height="10" fill="#f5efe2"/>
  <rect x="16.2" y="34.6" width="7.6" height="8.8" fill="#141c3a"/>
  <rect x="17.5" y="34" width="5" height="10" fill="#f5efe2"/>
  <rect x="40.2" y="34.6" width="7.6" height="8.8" fill="#141c3a"/>
  <rect x="41.5" y="34" width="5" height="10" fill="#f5efe2"/>
</svg>
